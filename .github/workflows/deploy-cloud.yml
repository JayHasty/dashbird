# Deploy code to Vultr after push to main (phone Cursor → push → live).
# Secrets (repo Settings → Secrets → Actions):
#   CLOUD_HOST              e.g. root@144.202.105.150
#   CLOUD_SSH_PRIVATE_KEY   ed25519 private key authorized on the VPS
#
# Code-only: never syncs data/ or .env. Laptop SYNC_DATA path unchanged.
name: Deploy cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          CLOUD_SSH_PRIVATE_KEY: ${{ secrets.CLOUD_SSH_PRIVATE_KEY }}
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
        run: |
          set -euo pipefail
          test -n "${CLOUD_SSH_PRIVATE_KEY:-}" || { echo "Missing secret CLOUD_SSH_PRIVATE_KEY"; exit 1; }
          test -n "${CLOUD_HOST:-}" || { echo "Missing secret CLOUD_HOST"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CLOUD_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          HOST_PART="${CLOUD_HOST#*@}"
          ssh-keyscan -H "$HOST_PART" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host dashbird-cloud"
            echo "  HostName ${HOST_PART}"
            echo "  User ${CLOUD_HOST%@*}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Sync code + rebuild
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
        run: |
          set -euo pipefail
          REMOTE_DIR=/opt/dashbird
          COMPOSE_FILE=docker-compose.cloud.yml

          ssh dashbird-cloud "mkdir -p '${REMOTE_DIR}/data' '${REMOTE_DIR}/public/data' '${REMOTE_DIR}/data/vikunja/db' '${REMOTE_DIR}/data/vikunja/files'"

          # Anchor /data/ so we skip only the repo root data/ volume — not public/data/
          # (unanchored "data/" also matched public/data and left admin bookmarks stuck on VPS).
          #
          # bookmarks-work.json is gitignored. Exclude it from --delete so GitHub Actions
          # (no local copy) cannot wipe cloud Admin tiles. Push explicitly when present.
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .env \
            --exclude /data/ \
            --exclude 'public/data/bookmarks-personal.json' \
            --exclude 'public/data/bookmarks-work.json' \
            --exclude 'public/data/bookmarks-*.json.bak' \
            --exclude 'public/data/notes.md' \
            --exclude 'public/data/last-backup.txt' \
            --exclude 'public/data/phone-lan-url.txt' \
            --exclude /deploy/jayhasty-site/ \
            --exclude .github \
            ./ "dashbird-cloud:${REMOTE_DIR}/"

          if [[ -f data/gmail-daily-summary-guide.md ]]; then
            rsync -avz data/gmail-daily-summary-guide.md "dashbird-cloud:${REMOTE_DIR}/data/gmail-daily-summary-guide.md"
          fi

          # gitignored live config — CI usually has no copy; laptop sync-to-cloud.sh is the normal path.
          if [[ -f data/job-watch-targets.json ]]; then
            rsync -avz data/job-watch-targets.json "dashbird-cloud:${REMOTE_DIR}/data/job-watch-targets.json"
          fi

          if [[ -f public/data/bookmarks-work.json ]]; then
            rsync -avz public/data/bookmarks-work.json "dashbird-cloud:${REMOTE_DIR}/public/data/bookmarks-work.json"
            LOCAL_SUM="$(sha256sum public/data/bookmarks-work.json | awk '{print $1}')"
            REMOTE_SUM="$(ssh dashbird-cloud "sha256sum '${REMOTE_DIR}/public/data/bookmarks-work.json'" | awk '{print $1}')"
            if [[ "$LOCAL_SUM" != "$REMOTE_SUM" ]]; then
              echo "ERROR: public/data/bookmarks-work.json mismatch after rsync (local=${LOCAL_SUM} remote=${REMOTE_SUM})" >&2
              exit 1
            fi
            if ! grep -q '"Deployed projects"' public/data/bookmarks-work.json; then
              echo "ERROR: local bookmarks-work.json missing Deployed projects section" >&2
              exit 1
            fi
            echo "Verified admin bookmarks synced (sha256=${LOCAL_SUM})"
          else
            echo "No local bookmarks-work.json in CI — leaving cloud Admin bookmarks untouched"
            if ! ssh dashbird-cloud "test -s '${REMOTE_DIR}/public/data/bookmarks-work.json'"; then
              echo "ERROR: cloud bookmarks-work.json missing or empty after deploy" >&2
              exit 1
            fi
            if ! ssh dashbird-cloud "grep -q '\"Deployed projects\"' '${REMOTE_DIR}/public/data/bookmarks-work.json'"; then
              echo "ERROR: cloud bookmarks-work.json missing Deployed projects section" >&2
              exit 1
            fi
          fi

          if [[ -f deploy/jayhasty-site/index.html ]]; then
            echo "Syncing static portfolio (deploy/jayhasty-site)"
            rsync -avz --delete deploy/jayhasty-site/ "dashbird-cloud:${REMOTE_DIR}/deploy/jayhasty-site/"
          else
            echo "No local deploy/jayhasty-site in CI — leaving cloud portfolio files untouched"
          fi
          if ! ssh dashbird-cloud "test -s '${REMOTE_DIR}/deploy/jayhasty-site/index.html'"; then
            echo "ERROR: cloud deploy/jayhasty-site/index.html missing (jayhasty.com would 404)" >&2
            echo "Publish from portfolio/products/website: npm run build:deploy, then rsync deploy/jayhasty-site" >&2
            exit 1
          fi

          ssh dashbird-cloud "cd '${REMOTE_DIR}' && docker compose -f '${COMPOSE_FILE}' up -d --build --force-recreate dashboard caddy"

          TARGET_N="$(ssh dashbird-cloud "python3 -c \"import json; d=json.load(open('${REMOTE_DIR}/data/job-watch-targets.json')); print(len(d.get('targets',[])))\" 2>/dev/null || echo 0")"
          if [[ "${TARGET_N:-0}" -lt 1 ]]; then
            echo "ERROR: cloud data/job-watch-targets.json missing or empty (${TARGET_N} targets)." >&2
            echo "Opportunity Watch will be blank. From laptop: ./scripts/sync-to-cloud.sh (needs data/job-watch-targets.json)" >&2
            exit 1
          fi
          echo "Opportunity Watch targets on cloud: ${TARGET_N}"

          DOMAIN="$(ssh dashbird-cloud "grep -E '^DASHBOARD_DOMAIN=' '${REMOTE_DIR}/.env' 2>/dev/null | cut -d= -f2-" || true)"
          echo "Deployed. Open: https://${DOMAIN:-dashbird.jayhasty.com}"
